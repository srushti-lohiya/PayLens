
name: PayLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Train and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EMBEDDER_BACKEND: tfidf
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint Python code
        run: |
          ruff check . --select E4,E7,E9,F63,F7,F82

      - name: Prepare dataset
        run: python -m src.data

      - name: Train salary model
        run: python -m src.train

      - name: Calibrate prediction intervals
        run: python -m src.intervals

      - name: Build RAG index
        run: python -m src.rag build

      - name: Run automated tests
        run: python -m pytest -q

